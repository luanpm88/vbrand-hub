<svg viewBox="0 0 520 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="400" rx="16" fill="#FEF7F2"/>
  <text x="260" y="40" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="14" font-weight="600" fill="#241C15">Changelog</text>
  <!-- Timeline line -->
  <line x1="100" y1="60" x2="100" y2="370" stroke="#E5E0DA" stroke-width="2"/>
  <!-- v5.2 -->
  <circle cx="100" cy="90" r="8" fill="#E8571A"/>
  <circle cx="100" cy="90" r="4" fill="#fff"/>
  <g transform="translate(124,74)">
