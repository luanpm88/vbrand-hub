    <text x="12" y="54" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">50+ responsive email templates redesigned.</text>
    <text x="12" y="66" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">Drag-and-drop builder with dark mode support.</text>
