    <text x="58" y="22" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">March 2026</text>
    <text x="12" y="40" font-family="IBM Plex Sans,sans-serif" font-size="11" font-weight="600" fill="#241C15">AI Email Writer</text>
    <text x="12" y="54" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">Generate subject lines, email copy, and CTAs</text>
    <text x="12" y="66" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">with built-in AI powered by OpenAI.</text>
  </g>
  <!-- v5.1 -->
  <circle cx="100" cy="190" r="8" fill="#E8571A" opacity="0.4"/>
  <circle cx="100" cy="190" r="4" fill="#FEF7F2"/>
  <g transform="translate(124,174)">
    <rect width="360" height="76" rx="10" fill="#fff" stroke="#E5E0DA" stroke-width="1.5"/>
    <rect x="12" y="10" width="36" height="18" rx="9" fill="#241C15"/>
    <text x="30" y="22" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="8" font-weight="700" fill="#fff">v5.1</text>
    <text x="58" y="22" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">January 2026</text>
    <text x="12" y="40" font-family="IBM Plex Sans,sans-serif" font-size="11" font-weight="600" fill="#241C15">Advanced Segments</text>
    <text x="12" y="54" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">Combine multiple conditions with AND/OR logic.</text>
    <text x="12" y="66" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">Segment by behavior, tags, and custom fields.</text>
  </g>
