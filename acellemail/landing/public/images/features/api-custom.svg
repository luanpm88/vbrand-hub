<svg viewBox="0 0 520 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="300" rx="12" fill="#241C15"/>
  <!-- Code editor -->
  <g transform="translate(24,20)">
    <circle cx="6" cy="6" r="4" fill="#E8571A"/><circle cx="18" cy="6" r="4" fill="#928B83"/><circle cx="30" cy="6" r="4" fill="#928B83"/>
    <text x="0" y="36" font-family="monospace" font-size="11" fill="#928B83">// Trigger automation via API</text>
    <text x="0" y="54" font-family="monospace" font-size="11"><tspan fill="#E8571A">$response</tspan><tspan fill="#928B83"> = </tspan><tspan fill="#fff">Http</tspan><tspan fill="#928B83">::</tspan><tspan fill="#E8571A">post</tspan><tspan fill="#928B83">(</tspan></text>
    <text x="16" y="72" font-family="monospace" font-size="11"><tspan fill="#E8571A">'https://mail.example.com/api/v1'</tspan><tspan fill="#928B83">,</tspan></text>
    <text x="16" y="90" font-family="monospace" font-size="11" fill="#928B83">[</text>
    <text x="32" y="108" font-family="monospace" font-size="11"><tspan fill="#E8571A">'action'</tspan><tspan fill="#928B83"> => </tspan><tspan fill="#E8571A">'subscribe'</tspan><tspan fill="#928B83">,</tspan></text>
    <text x="32" y="126" font-family="monospace" font-size="11"><tspan fill="#E8571A">'email'</tspan><tspan fill="#928B83">  => </tspan><tspan fill="#E8571A">$user->email</tspan><tspan fill="#928B83">,</tspan></text>
    <text x="32" y="144" font-family="monospace" font-size="11"><tspan fill="#E8571A">'list'</tspan><tspan fill="#928B83">   => </tspan><tspan fill="#E8571A">'welcome-series'</tspan></text>
    <text x="16" y="162" font-family="monospace" font-size="11" fill="#928B83">]</text>
    <text x="0" y="180" font-family="monospace" font-size="11" fill="#928B83">);</text>
  </g>
  <!-- Response card -->
  <g transform="translate(320,50)">
    <rect width="176" height="120" rx="8" fill="#403B36"/>
    <text x="12" y="22" font-family="monospace" font-size="9" fill="#928B83">Response 200 OK</text>
    <text x="12" y="42" font-family="monospace" font-size="10" fill="#928B83">{</text>
    <text x="20" y="56" font-family="monospace" font-size="10"><tspan fill="#E8571A">"status"</tspan><tspan fill="#928B83">: </tspan><tspan fill="#E8571A">"subscribed"</tspan></text>
    <text x="20" y="72" font-family="monospace" font-size="10"><tspan fill="#E8571A">"automation"</tspan><tspan fill="#928B83">: </tspan><tspan fill="#E8571A">"triggered"</tspan></text>
    <text x="20" y="88" font-family="monospace" font-size="10"><tspan fill="#E8571A">"list_id"</tspan><tspan fill="#928B83">: </tspan><tspan fill="#E8571A">"wlc-001"</tspan></text>
    <text x="12" y="104" font-family="monospace" font-size="10" fill="#928B83">}</text>
  </g>
  <!-- API endpoints bar -->
  <g transform="translate(24,220)">
    <rect width="472" height="56" rx="8" fill="#403B36"/>
    <g transform="translate(16,12)">
      <rect width="40" height="16" rx="4" fill="#E8571A"/><text x="20" y="12" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#fff">POST</text>
      <text x="48" y="12" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#fff">/api/v1/subscribers</text>
    </g>
    <g transform="translate(16,34)">
      <rect width="34" height="16" rx="4" fill="#928B83"/><text x="17" y="12" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#fff">GET</text>
      <text x="42" y="12" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#928B83">/api/v1/campaigns</text>
      <rect x="200" y="0" width="40" height="16" rx="4" fill="#E8571A"/><text x="220" y="12" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#fff">PUT</text>
      <text x="248" y="12" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#928B83">/api/v1/lists/{id}</text>
    </g>
  </g>
</svg>
