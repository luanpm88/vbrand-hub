<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'IBM Plex Sans', Arial, sans-serif">
  <defs>
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#241C15" flood-opacity="0.10"/>
    </filter>
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#241C15" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="#FEF7F2"/>

  <!-- Editor window shell -->
  <rect x="30" y="28" width="540" height="394" rx="12" fill="#FFFFFF" filter="url(#shadow-soft)"/>

  <!-- Window titlebar -->
  <rect x="30" y="28" width="540" height="38" rx="12" fill="#F6F1EB"/>
  <rect x="30" y="50" width="540" height="16" fill="#F6F1EB"/>
  <!-- Traffic lights -->
  <circle cx="56" cy="47" r="6" fill="#E5E0DA"/>
  <circle cx="74" cy="47" r="6" fill="#E5E0DA"/>
  <circle cx="92" cy="47" r="6" fill="#E8571A" opacity="0.7"/>
  <!-- Tab bar -->
  <rect x="120" y="37" width="110" height="22" rx="4" fill="#FFFFFF"/>
  <text x="175" y="52" font-size="11" fill="#241C15" text-anchor="middle" font-weight="500">Email Builder</text>
  <rect x="238" y="37" width="80" height="22" rx="4" fill="none"/>
  <text x="278" y="52" font-size="11" fill="#928B83" text-anchor="middle">Preview</text>

  <!-- ======== LEFT PANEL — Component Sidebar ======== -->
  <rect x="30" y="66" width="148" height="356" fill="#F6F1EB"/>
  <!-- Panel title -->
  <text x="44" y="90" font-size="10" fill="#928B83" font-weight="600" letter-spacing="0.8">BLOCKS</text>

  <!-- Search box -->
  <rect x="40" y="97" width="128" height="26" rx="5" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1"/>
  <text x="55" y="114" font-size="10" fill="#928B83">Search blocks...</text>
  <!-- Search icon -->
  <circle cx="148" cy="110" r="5" fill="none" stroke="#928B83" stroke-width="1.2"/>
  <line x1="152" y1="114" x2="155" y2="117" stroke="#928B83" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Section label -->
  <text x="44" y="140" font-size="9" fill="#928B83" font-weight="600" letter-spacing="0.6">CONTENT</text>

  <!-- Block: Text -->
  <rect x="40" y="147" width="128" height="34" rx="6" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1" filter="url(#shadow-card)"/>
  <rect x="52" y="158" width="16" height="3" rx="1.5" fill="#928B83"/>
  <rect x="52" y="164" width="22" height="3" rx="1.5" fill="#928B83"/>
  <rect x="52" y="170" width="14" height="3" rx="1.5" fill="#928B83"/>
  <text x="82" y="168" font-size="10" fill="#241C15" font-weight="500">Text</text>

  <!-- Block: Image -->
  <rect x="40" y="188" width="128" height="34" rx="6" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1" filter="url(#shadow-card)"/>
  <rect x="52" y="198" width="20" height="14" rx="2" fill="#E5E0DA"/>
  <line x1="52" y1="208" x2="57" y2="202" stroke="#928B83" stroke-width="1"/>
  <line x1="57" y1="202" x2="62" y2="207" stroke="#928B83" stroke-width="1"/>
  <line x1="62" y1="207" x2="66" y2="203" stroke="#928B83" stroke-width="1"/>
  <line x1="66" y1="203" x2="72" y2="212" stroke="#928B83" stroke-width="1"/>
  <circle cx="70" cy="201" r="2" fill="#928B83"/>
  <text x="82" y="208" font-size="10" fill="#241C15" font-weight="500">Image</text>

  <!-- Block: Button — highlighted/dragging -->
  <rect x="40" y="229" width="128" height="34" rx="6" fill="#FEF7F2" stroke="#E8571A" stroke-width="1.5" filter="url(#shadow-card)"/>
  <rect x="52" y="239" width="22" height="12" rx="3" fill="#E8571A"/>
  <text x="82" y="249" font-size="10" fill="#241C15" font-weight="500">Button</text>
  <text x="157" y="249" font-size="9" fill="#E8571A">✦</text>

  <!-- Block: Divider -->
  <rect x="40" y="270" width="128" height="34" rx="6" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1"/>
  <line x1="52" y1="289" x2="74" y2="289" stroke="#928B83" stroke-width="2" stroke-linecap="round"/>
  <text x="82" y="290" font-size="10" fill="#241C15" font-weight="500">Divider</text>

  <!-- Block: Social -->
  <rect x="40" y="311" width="128" height="34" rx="6" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1"/>
  <circle cx="57" cy="328" r="6" fill="#E5E0DA"/>
  <circle cx="70" cy="328" r="6" fill="#E5E0DA"/>
  <text x="82" y="331" font-size="10" fill="#241C15" font-weight="500">Social</text>

  <!-- Section label 2 -->
  <text x="44" y="365" font-size="9" fill="#928B83" font-weight="600" letter-spacing="0.6">LAYOUT</text>

  <!-- Block: Columns -->
  <rect x="40" y="372" width="128" height="34" rx="6" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1"/>
  <rect x="52" y="381" width="10" height="14" rx="1" fill="#E5E0DA"/>
  <rect x="65" y="381" width="10" height="14" rx="1" fill="#E5E0DA"/>
  <rect x="78" y="381" width="10" height="14" rx="1" fill="#E5E0DA"/>
  <text x="98" y="390" font-size="10" fill="#241C15" font-weight="500">Columns</text>

  <!-- ======== CENTER PANEL — Email Canvas ======== -->
  <!-- Canvas background -->
  <rect x="178" y="66" width="284" height="356" fill="#E5E0DA"/>

  <!-- Email card -->
  <rect x="200" y="78" width="240" height="332" rx="4" fill="#FFFFFF" filter="url(#shadow-card)"/>

  <!-- Email header band -->
  <rect x="200" y="78" width="240" height="52" rx="4" fill="#241C15"/>
  <rect x="200" y="110" width="240" height="20" fill="#241C15"/>
  <!-- Logo area in header -->
  <rect x="216" y="91" width="30" height="8" rx="2" fill="#E8571A"/>
  <rect x="252" y="91" width="50" height="8" rx="2" fill="#FFFFFF" opacity="0.3"/>
  <!-- Nav links in header -->
  <rect x="326" y="91" width="30" height="8" rx="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="364" y="91" width="30" height="8" rx="2" fill="#FFFFFF" opacity="0.2"/>

  <!-- Hero image placeholder -->
  <rect x="200" y="130" width="240" height="90" fill="#F6F1EB"/>
  <!-- image placeholder graphic -->
  <rect x="248" y="148" width="144" height="54" rx="3" fill="#E5E0DA"/>
  <circle cx="272" cy="162" r="8" fill="#928B83" opacity="0.4"/>
  <polygon points="272,172 284,158 296,172" fill="#928B83" opacity="0.4"/>
  <polygon points="296,172 308,163 320,172" fill="#928B83" opacity="0.3"/>
  <!-- Image label -->
  <text x="320" y="182" font-size="8" fill="#928B83" text-anchor="middle">Product Image</text>

  <!-- Headline text block — selected/active -->
  <rect x="200" y="220" width="240" height="1" fill="#E5E0DA"/>
  <rect x="200" y="221" width="240" height="66" fill="#FFFFFF"/>
  <!-- Blue selection outline -->
  <rect x="202" y="223" width="236" height="62" rx="2" fill="none" stroke="#E8571A" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Selection handles -->
  <rect x="198" y="221" width="6" height="6" rx="1" fill="#E8571A"/>
  <rect x="436" y="221" width="6" height="6" rx="1" fill="#E8571A"/>
  <rect x="198" y="279" width="6" height="6" rx="1" fill="#E8571A"/>
  <rect x="436" y="279" width="6" height="6" rx="1" fill="#E8571A"/>
  <!-- Headline text lines -->
  <rect x="218" y="232" width="162" height="10" rx="2" fill="#241C15"/>
  <rect x="230" y="248" width="138" height="10" rx="2" fill="#241C15" opacity="0.7"/>
  <rect x="240" y="264" width="120" height="8" rx="2" fill="#928B83" opacity="0.5"/>

  <!-- Subtext block -->
  <rect x="200" y="287" width="240" height="44" fill="#FFFFFF"/>
  <rect x="216" y="295" width="170" height="7" rx="1.5" fill="#E5E0DA"/>
  <rect x="216" y="306" width="158" height="7" rx="1.5" fill="#E5E0DA"/>
  <rect x="216" y="317" width="120" height="7" rx="1.5" fill="#E5E0DA"/>

  <!-- CTA Button block -->
  <rect x="200" y="331" width="240" height="50" fill="#FEF7F2"/>
  <rect x="256" y="342" width="128" height="30" rx="6" fill="#E8571A"/>
  <text x="320" y="362" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">Get Started Free</text>

  <!-- Footer -->
  <rect x="200" y="381" width="240" height="29" rx="4" fill="#F6F1EB"/>
  <rect x="200" y="381" width="240" height="8" fill="#F6F1EB"/>
  <rect x="230" y="388" width="40" height="5" rx="1" fill="#E5E0DA"/>
  <rect x="278" y="388" width="40" height="5" rx="1" fill="#E5E0DA"/>
  <rect x="326" y="388" width="40" height="5" rx="1" fill="#E5E0DA"/>
  <rect x="240" y="398" width="160" height="5" rx="1" fill="#E5E0DA"/>

  <!-- Drag ghost — button block being dragged from sidebar -->
  <rect x="316" y="318" width="80" height="22" rx="4" fill="#E8571A" opacity="0.25" stroke="#E8571A" stroke-width="1"/>
  <rect x="325" y="325" width="62" height="8" rx="2" fill="#E8571A" opacity="0.4"/>

  <!-- ======== RIGHT PANEL — Properties ======== -->
  <rect x="462" y="66" width="108" height="356" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1"/>
  <text x="472" y="88" font-size="10" fill="#928B83" font-weight="600" letter-spacing="0.6">PROPERTIES</text>

  <!-- Property: Font -->
  <text x="472" y="108" font-size="9" fill="#928B83">Font</text>
  <rect x="472" y="112" width="88" height="22" rx="4" fill="#F6F1EB" stroke="#E5E0DA" stroke-width="1"/>
  <text x="480" y="126" font-size="9" fill="#241C15">IBM Plex Sans</text>

  <!-- Property: Size -->
  <text x="472" y="148" font-size="9" fill="#928B83">Size</text>
  <rect x="472" y="152" width="40" height="22" rx="4" fill="#F6F1EB" stroke="#E5E0DA" stroke-width="1"/>
  <text x="492" y="166" font-size="9" fill="#241C15" text-anchor="middle">28</text>

  <!-- Property: Color -->
  <text x="472" y="190" font-size="9" fill="#928B83">Color</text>
  <rect x="472" y="194" width="22" height="22" rx="4" fill="#241C15" stroke="#E5E0DA" stroke-width="1"/>
  <rect x="500" y="194" width="60" height="22" rx="4" fill="#F6F1EB" stroke="#E5E0DA" stroke-width="1"/>
  <text x="530" y="208" font-size="9" fill="#241C15" text-anchor="middle">#241C15</text>

  <!-- Property: Align -->
  <text x="472" y="232" font-size="9" fill="#928B83">Align</text>
  <rect x="472" y="236" width="26" height="22" rx="4" fill="#E8571A"/>
  <rect x="480" y="241" width="12" height="2" rx="1" fill="#FFF"/>
  <rect x="478" y="245" width="16" height="2" rx="1" fill="#FFF"/>
  <rect x="480" y="249" width="12" height="2" rx="1" fill="#FFF"/>
  <rect x="502" y="236" width="26" height="22" rx="4" fill="#F6F1EB" stroke="#E5E0DA" stroke-width="1"/>
  <rect x="507" y="241" width="16" height="2" rx="1" fill="#928B83"/>
  <rect x="507" y="245" width="16" height="2" rx="1" fill="#928B83"/>
  <rect x="507" y="249" width="16" height="2" rx="1" fill="#928B83"/>
  <rect x="532" y="236" width="26" height="22" rx="4" fill="#F6F1EB" stroke="#E5E0DA" stroke-width="1"/>
  <rect x="537" y="241" width="16" height="2" rx="1" fill="#928B83"/>
  <rect x="541" y="245" width="8" height="2" rx="1" fill="#928B83"/>
  <rect x="537" y="249" width="16" height="2" rx="1" fill="#928B83"/>

  <!-- Property: Padding -->
  <text x="472" y="276" font-size="9" fill="#928B83">Padding</text>
  <rect x="472" y="280" width="40" height="22" rx="4" fill="#F6F1EB" stroke="#E5E0DA" stroke-width="1"/>
  <text x="492" y="294" font-size="9" fill="#241C15" text-anchor="middle">16px</text>
  <rect x="520" y="280" width="40" height="22" rx="4" fill="#F6F1EB" stroke="#E5E0DA" stroke-width="1"/>
  <text x="540" y="294" font-size="9" fill="#241C15" text-anchor="middle">16px</text>

  <!-- Property divider -->
  <line x1="472" y1="314" x2="560" y2="314" stroke="#E5E0DA" stroke-width="1"/>

  <!-- BG color -->
  <text x="472" y="330" font-size="9" fill="#928B83">Background</text>
  <rect x="472" y="334" width="22" height="22" rx="4" fill="#FEF7F2" stroke="#E5E0DA" stroke-width="1"/>
  <rect x="500" y="334" width="60" height="22" rx="4" fill="#F6F1EB" stroke="#E5E0DA" stroke-width="1"/>
  <text x="530" y="348" font-size="9" fill="#241C15" text-anchor="middle">#FEF7F2</text>

  <!-- Border radius -->
  <text x="472" y="372" font-size="9" fill="#928B83">Radius</text>
  <rect x="472" y="376" width="40" height="22" rx="4" fill="#F6F1EB" stroke="#E5E0DA" stroke-width="1"/>
  <text x="492" y="390" font-size="9" fill="#241C15" text-anchor="middle">6px</text>

  <!-- Bottom action bar -->
  <rect x="30" y="388" width="540" height="34" rx="12" fill="#F6F1EB"/>
  <rect x="30" y="388" width="540" height="18" fill="#F6F1EB"/>
  <!-- Undo/Redo -->
  <rect x="44" y="396" width="28" height="18" rx="4" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1"/>
  <text x="58" y="408" font-size="9" fill="#928B83" text-anchor="middle">↩</text>
  <rect x="76" y="396" width="28" height="18" rx="4" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1"/>
  <text x="90" y="408" font-size="9" fill="#928B83" text-anchor="middle">↪</text>
  <!-- Save button -->
  <rect x="470" y="394" width="88" height="22" rx="5" fill="#E8571A"/>
  <text x="514" y="409" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="600">Save &amp; Send</text>
  <!-- Preview toggle -->
  <rect x="366" y="394" width="96" height="22" rx="5" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1"/>
  <text x="414" y="409" font-size="10" fill="#241C15" text-anchor="middle">Preview Email</text>
</svg>
