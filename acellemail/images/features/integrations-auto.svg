<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', Arial, sans-serif">
  <!-- Light background -->
  <rect width="520" height="400" rx="16" fill="#FEF7F2"/>

  <!-- Title -->
  <text x="260" y="44" font-size="15" font-weight="600" fill="#241C15" text-anchor="middle">Integration Automation</text>
  <text x="260" y="62" font-size="12" fill="#928B83" text-anchor="middle">Route, relay, and sync across your stack</text>

  <!-- Central hub -->
  <circle cx="260" cy="220" r="46" fill="#241C15"/>
  <text x="260" y="214" font-size="10" font-weight="500" fill="#928B83" text-anchor="middle">AcelleMail</text>
  <text x="260" y="230" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Hub</text>

  <!-- Connector lines (hub to nodes) -->
  <!-- SES — top-left -->
  <line x1="222" y1="186" x2="148" y2="136" stroke="#E5E0DA" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="148,136 155,128 160,141" fill="#E8571A"/>

  <!-- SendGrid — top-right -->
  <line x1="298" y1="186" x2="374" y2="136" stroke="#E5E0DA" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="374,136 380,128 385,141" fill="#E8571A"/>

  <!-- Mailgun — bottom-left -->
  <line x1="222" y1="252" x2="148" y2="302" stroke="#E5E0DA" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="148,302 141,310 156,310" fill="#928B83"/>

  <!-- Webhook — bottom-right -->
  <line x1="298" y1="252" x2="374" y2="302" stroke="#E5E0DA" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="374,302 381,310 368,312" fill="#928B83"/>

  <!-- SMTP — left -->
  <line x1="214" y1="220" x2="116" y2="220" stroke="#E5E0DA" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="116,220 124,214 124,226" fill="#E8571A"/>

  <!-- API — right -->
  <line x1="306" y1="220" x2="404" y2="220" stroke="#E5E0DA" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="404,220 396,214 396,226" fill="#E8571A"/>

  <!-- Node: SES (top-left) -->
  <rect x="100" y="98" width="56" height="56" rx="12" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1.5"/>
  <text x="128" y="132" font-size="20" font-weight="700" fill="#E8571A" text-anchor="middle">S</text>
  <text x="128" y="167" font-size="10" fill="#928B83" text-anchor="middle">AWS SES</text>

  <!-- Node: SendGrid (top-right) -->
  <rect x="364" y="98" width="56" height="56" rx="12" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1.5"/>
  <text x="392" y="132" font-size="20" font-weight="700" fill="#241C15" text-anchor="middle">G</text>
  <text x="392" y="167" font-size="10" fill="#928B83" text-anchor="middle">SendGrid</text>

  <!-- Node: Mailgun (bottom-left) -->
  <rect x="100" y="278" width="56" height="56" rx="12" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1.5"/>
  <text x="128" y="312" font-size="20" font-weight="700" fill="#241C15" text-anchor="middle">M</text>
  <text x="128" y="347" font-size="10" fill="#928B83" text-anchor="middle">Mailgun</text>

  <!-- Node: Webhook (bottom-right) -->
  <rect x="364" y="278" width="56" height="56" rx="12" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1.5"/>
  <text x="392" y="312" font-size="20" font-weight="700" fill="#241C15" text-anchor="middle">W</text>
  <text x="392" y="347" font-size="10" fill="#928B83" text-anchor="middle">Webhook</text>

  <!-- Node: SMTP (left) -->
  <rect x="60" y="192" width="56" height="56" rx="12" fill="#E8571A"/>
  <text x="88" y="226" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">SMTP</text>
  <text x="88" y="261" font-size="10" fill="#928B83" text-anchor="middle">Relay</text>

  <!-- Node: API (right) -->
  <rect x="404" y="192" width="56" height="56" rx="12" fill="#E8571A"/>
  <text x="432" y="226" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">API</text>
  <text x="432" y="261" font-size="10" fill="#928B83" text-anchor="middle">REST</text>
</svg>
