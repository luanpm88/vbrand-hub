<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', Arial, sans-serif">
  <!-- Dark background -->
  <rect width="520" height="400" rx="16" fill="#241C15"/>

  <!-- Title -->
  <text x="32" y="48" font-size="15" font-weight="600" fill="#FFFFFF" letter-spacing="0.2">Conversion Insights</text>
  <text x="32" y="66" font-size="12" fill="#928B83">Predictive engagement score</text>

  <!-- Donut chart group, centered at 150,200 -->
  <!-- Donut background ring -->
  <circle cx="150" cy="210" r="72" fill="none" stroke="#3A2E24" stroke-width="20"/>
  <!-- Donut filled arc: 78% = 280.8deg, stroke-dasharray on circle circumference 2πr ≈ 452.4 -->
  <!-- circumference = 452.4; 78% = 352.9 -->
  <circle cx="150" cy="210" r="72" fill="none" stroke="#E8571A" stroke-width="20"
    stroke-dasharray="352.9 452.4"
    stroke-dashoffset="113.1"
    stroke-linecap="round"
    transform="rotate(-90 150 210)"/>
  <!-- Center label -->
  <text x="150" y="203" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">78%</text>
  <text x="150" y="222" font-size="11" fill="#928B83" text-anchor="middle">Likely to Convert</text>

  <!-- Legend dots -->
  <circle cx="92" cy="302" r="5" fill="#E8571A"/>
  <text x="102" y="307" font-size="11" fill="#928B83">High intent</text>
  <circle cx="172" cy="302" r="5" fill="#3A2E24"/>
  <text x="182" y="307" font-size="11" fill="#928B83">Other</text>

  <!-- Divider -->
  <line x1="262" y1="80" x2="262" y2="330" stroke="#3A2E24" stroke-width="1"/>

  <!-- Bar chart section -->
  <text x="282" y="96" font-size="12" font-weight="600" fill="#FFFFFF">Engagement Breakdown</text>

  <!-- Bar 1: Opened -->
  <text x="282" y="128" font-size="11" fill="#928B83">Opened</text>
  <rect x="282" y="134" width="200" height="14" rx="7" fill="#3A2E24"/>
  <rect x="282" y="134" width="154" height="14" rx="7" fill="#E8571A"/>
  <text x="492" y="146" font-size="10" fill="#E8571A" text-anchor="end">77%</text>

  <!-- Bar 2: Clicked -->
  <text x="282" y="172" font-size="11" fill="#928B83">Clicked</text>
  <rect x="282" y="178" width="200" height="14" rx="7" fill="#3A2E24"/>
  <rect x="282" y="178" width="98" height="14" rx="7" fill="#E8571A" opacity="0.75"/>
  <text x="492" y="190" font-size="10" fill="#928B83" text-anchor="end">49%</text>

  <!-- Bar 3: Converted -->
  <text x="282" y="216" font-size="11" fill="#928B83">Converted</text>
  <rect x="282" y="222" width="200" height="14" rx="7" fill="#3A2E24"/>
  <rect x="282" y="222" width="62" height="14" rx="7" fill="#E8571A" opacity="0.5"/>
  <text x="492" y="234" font-size="10" fill="#928B83" text-anchor="end">31%</text>

  <!-- Stat row -->
  <rect x="282" y="262" width="88" height="48" rx="8" fill="#2E231A"/>
  <text x="326" y="283" font-size="11" fill="#928B83" text-anchor="middle">Avg. Score</text>
  <text x="326" y="300" font-size="18" font-weight="700" fill="#E8571A" text-anchor="middle">8.4</text>

  <rect x="380" y="262" width="102" height="48" rx="8" fill="#2E231A"/>
  <text x="431" y="283" font-size="11" fill="#928B83" text-anchor="middle">This Week</text>
  <text x="431" y="300" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">+12%</text>

  <!-- Send Campaign button -->
  <rect x="282" y="330" width="200" height="38" rx="8" fill="#E8571A"/>
  <text x="382" y="354" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Send Campaign</text>
</svg>
