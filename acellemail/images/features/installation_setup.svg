<svg viewBox="0 0 520 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="400" rx="16" fill="#FEF7F2"/>
  <!-- Terminal -->
  <g transform="translate(30,30)">
    <rect width="290" height="240" rx="12" fill="#241C15"/>
    <circle cx="20" cy="16" r="5" fill="#E8571A"/><circle cx="36" cy="16" r="5" fill="#928B83"/><circle cx="52" cy="16" r="5" fill="#928B83"/>
    <text x="16" y="50" font-family="monospace" font-size="10" fill="#928B83">$ <tspan fill="#E8571A">composer</tspan> <tspan fill="#fff">install</tspan></text>
    <text x="16" y="68" font-family="monospace" font-size="10" fill="#928B83">Installing dependencies...</text>
    <text x="16" y="82" font-family="monospace" font-size="10" fill="#E8571A">✓ <tspan fill="#928B83">Done in 42s</tspan></text>
    <text x="16" y="106" font-family="monospace" font-size="10" fill="#928B83">$ <tspan fill="#E8571A">php artisan</tspan> <tspan fill="#fff">migrate</tspan></text>
    <text x="16" y="124" font-family="monospace" font-size="10" fill="#928B83">Migrating: create_users_table</text>
    <text x="16" y="138" font-family="monospace" font-size="10" fill="#928B83">Migrating: create_campaigns_table</text>
    <text x="16" y="152" font-family="monospace" font-size="10" fill="#E8571A">✓ <tspan fill="#928B83">56 tables migrated</tspan></text>
    <text x="16" y="176" font-family="monospace" font-size="10" fill="#928B83">$ <tspan fill="#E8571A">php artisan</tspan> <tspan fill="#fff">key:generate</tspan></text>
    <text x="16" y="194" font-family="monospace" font-size="10" fill="#E8571A">✓ <tspan fill="#928B83">Application key set</tspan></text>
    <text x="16" y="218" font-family="monospace" font-size="10" fill="#928B83">$ <tspan fill="#E8571A">php artisan</tspan> <tspan fill="#fff">serve</tspan></text>
    <text x="16" y="236" font-family="monospace" font-size="10" fill="#E8571A">Server running on http://127.0.0.1:8000</text>
    <rect x="16" y="244" width="8" height="14" fill="#E8571A" opacity="0.6"/>
  </g>
  <!-- Checklist -->
  <g transform="translate(340,30)">
    <rect width="150" height="240" rx="12" fill="#fff" stroke="#E5E0DA" stroke-width="1.5"/>
    <text x="16" y="28" font-family="IBM Plex Sans,sans-serif" font-size="11" font-weight="600" fill="#241C15">Requirements</text>
    <g transform="translate(16,44)">
      <circle cx="8" cy="8" r="8" fill="#E8571A" opacity="0.1"/><path d="M4 8l3 3 5-5" stroke="#E8571A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="12" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#241C15">PHP 8.1+</text>
    </g>
    <g transform="translate(16,72)">
      <circle cx="8" cy="8" r="8" fill="#E8571A" opacity="0.1"/><path d="M4 8l3 3 5-5" stroke="#E8571A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="12" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#241C15">MySQL 5.7+</text>
    </g>
    <g transform="translate(16,100)">
      <circle cx="8" cy="8" r="8" fill="#E8571A" opacity="0.1"/><path d="M4 8l3 3 5-5" stroke="#E8571A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="12" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#241C15">Redis</text>
    </g>
    <g transform="translate(16,128)">
      <circle cx="8" cy="8" r="8" fill="#E8571A" opacity="0.1"/><path d="M4 8l3 3 5-5" stroke="#E8571A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="12" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#241C15">Cron Jobs</text>
    </g>
    <g transform="translate(16,156)">
      <circle cx="8" cy="8" r="8" fill="#E8571A" opacity="0.1"/><path d="M4 8l3 3 5-5" stroke="#E8571A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="12" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#241C15">Supervisor</text>
    </g>
    <g transform="translate(16,184)">
      <circle cx="8" cy="8" r="8" fill="#E8571A" opacity="0.1"/><path d="M4 8l3 3 5-5" stroke="#E8571A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="12" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#241C15">SSL Certificate</text>
    </g>
    <text x="16" y="220" font-family="IBM Plex Sans,sans-serif" font-size="9" font-weight="600" fill="#E8571A">All checks passed ✓</text>
  </g>
  <!-- Bottom bar -->
  <g transform="translate(30,290)">
    <rect width="460" height="80" rx="12" fill="#fff" stroke="#E5E0DA" stroke-width="1.5"/>
    <text x="24" y="28" font-family="IBM Plex Sans,sans-serif" font-size="11" font-weight="600" fill="#241C15">Installation time</text>
    <text x="24" y="48" font-family="IBM Plex Sans,sans-serif" font-size="20" font-weight="700" fill="#E8571A">~5 minutes</text>
    <text x="24" y="64" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">From download to sending your first campaign</text>
    <rect x="340" y="22" width="96" height="36" rx="18" fill="#E8571A"/>
    <text x="388" y="44" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="10" font-weight="600" fill="#fff">Get Started</text>
  </g>
</svg>
