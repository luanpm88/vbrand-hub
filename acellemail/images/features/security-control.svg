      <text x="30" y="26" font-family="IBM Plex Sans,sans-serif" font-size="8" fill="#928B83">Templates, images, logs</text>
      <path d="M158 14l3 3 5-5" stroke="#E8571A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
