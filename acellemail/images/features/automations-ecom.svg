<svg viewBox="0 0 520 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="400" rx="16" fill="#FEF7F2"/>
  <!-- Trigger -->
  <rect x="160" y="24" width="200" height="44" rx="22" fill="#E8571A"/>
  <text x="260" y="50" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="12" font-weight="600" fill="#fff">Customer Purchased</text>
  <line x1="260" y1="68" x2="260" y2="90" stroke="#928B83" stroke-width="1.5"/><polygon points="255,87 260,95 265,87" fill="#928B83"/>
  <!-- Wait -->
  <rect x="180" y="95" width="160" height="36" rx="8" fill="#fff" stroke="#E5E0DA" stroke-width="1.5"/>
  <circle cx="202" cy="113" r="8" fill="#FEF7F2" stroke="#E8571A" stroke-width="1.5"/>
  <text x="270" y="117" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="11" font-weight="500" fill="#241C15">Wait 3 days</text>
  <line x1="260" y1="131" x2="260" y2="150" stroke="#928B83" stroke-width="1.5"/><polygon points="255,147 260,155 265,147" fill="#928B83"/>
  <!-- Send review email -->
  <rect x="140" y="155" width="240" height="36" rx="8" fill="#fff" stroke="#E5E0DA" stroke-width="1.5"/>
  <rect x="154" y="165" width="16" height="12" rx="2" fill="none" stroke="#E8571A" stroke-width="1.5"/>
  <path d="M154 165l8 6 8-6" stroke="#E8571A" stroke-width="1.5" stroke-linecap="round"/>
  <text x="270" y="177" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="11" font-weight="500" fill="#241C15">Send Review Request</text>
  <!-- Email preview -->
  <g transform="translate(115,210)">
    <rect width="290" height="140" rx="12" fill="#fff" stroke="#E5E0DA" stroke-width="1.5"/>
    <rect x="16" y="16" width="100" height="8" rx="4" fill="#241C15" opacity="0.12"/>
    <text x="16" y="42" font-family="IBM Plex Sans,sans-serif" font-size="10" font-weight="600" fill="#241C15">How was your order?</text>
    <text x="16" y="56" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">We'd love your feedback on</text>
    <text x="16" y="68" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#928B83">your recent purchase.</text>
    <!-- Stars -->
    <g transform="translate(16,80)">
      <text x="0" y="14" font-family="IBM Plex Sans,sans-serif" font-size="20" fill="#E8571A">★★★★★</text>
    </g>
    <rect x="16" y="110" width="80" height="20" rx="10" fill="#E8571A"/>
    <text x="56" y="124" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="9" font-weight="600" fill="#fff">Leave Review</text>
    <!-- Mini product card -->
    <g transform="translate(200,40)">
      <rect width="72" height="85" rx="6" fill="#F6F1EB" stroke="#E5E0DA" stroke-width="1"/>
      <rect x="8" y="8" width="56" height="40" rx="4" fill="#E5E0DA"/>
      <text x="36" y="32" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#928B83">📦</text>
      <text x="36" y="62" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="8" font-weight="500" fill="#241C15">Widget Pro</text>
      <text x="36" y="74" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="8" font-weight="600" fill="#E8571A">$49.00</text>
    </g>
  </g>
  <!-- Stats -->
  <g transform="translate(30,365)">
    <rect width="460" height="24" rx="6" fill="#241C15"/>
    <text x="80" y="16" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="9" font-weight="500" fill="#928B83">Open rate: <tspan fill="#E8571A" font-weight="700">68%</tspan></text>
    <text x="230" y="16" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="9" font-weight="500" fill="#928B83">Review rate: <tspan fill="#E8571A" font-weight="700">24%</tspan></text>
    <text x="380" y="16" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="9" font-weight="500" fill="#928B83">Avg rating: <tspan fill="#E8571A" font-weight="700">4.7 ★</tspan></text>
  </g>
</svg>
